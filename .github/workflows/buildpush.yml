name: CI

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build and publish Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.PAUDDASMEN_HUB_REGISTRY }}
          username: ${{ secrets.PAUDDASMEN_HUB_USERNAME }}
          password: ${{ secrets.PAUDDASMEN_HUB_PASSWORD }}

      - name: Push fuadkleb/nginx-proxy:multi
        uses: docker/build-push-action@v4
        if: ${{ github.event_name != 'pull_request' }}
        with:
          context: nginx/
          tags: ${{ secrets.PAUDDASMEN_HUB_REGISTRY }}/nginx-proxy:multi
          platforms: linux/amd64,linux/arm64
          push: true

      - name: Push fuadkleb/nginx-proxy:multiws
        uses: docker/build-push-action@v4
        if: ${{ github.event_name != 'pull_request' }}
        with:
          context: nginx-ws/
          tags: ${{ secrets.PAUDDASMEN_HUB_REGISTRY }}/nginx-proxy:multiws
          platforms: linux/amd64,linux/arm64
          push: true
